<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#172554">
    <title>Worker Salary Management</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172554;
        }

        header {
            background: #172554;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        main {
            max-width: 600px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 14px;
            box-shadow: 0 3px 12px #00000010;
        }

        button {
            background: #2563eb;
            color: white;
            border: 0;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>Worker Salary Management</h1>
    <p>Attendance & Salary Tracker</p>
</header>

<main>
    <div class="card">
        <h2>Welcome!</h2>
        <p>Your independent worker management app.</p>
        <p>Daily salary: <strong>Rs. 2,000</strong></p>
        <button onclick="alert('Your app is working!')">
            Test App
        </button>
    </div>
</main>

<footer style="text-align:center; padding:20px; color:#8492a6;">
    Developed by <strong>Saranga (K.D.S.R)</strong>
</footer>

</body>
</html>
